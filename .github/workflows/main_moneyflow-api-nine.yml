# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - moneyflow-api-nine

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_moneyflow-api-nine.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore API
        run: dotnet restore backend/MoneyFlow.Api/MoneyFlow.Api.csproj

      - name: Build API
        run: dotnet build backend/MoneyFlow.Api/MoneyFlow.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/MoneyFlow.Api.Tests/MoneyFlow.Api.Tests.csproj --configuration Release

      - name: Publish API
        run: dotnet publish backend/MoneyFlow.Api/MoneyFlow.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_83114DA9B4DC4E72994E59AD52311598 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5FDFE62000794F03ABF7F43688F9214E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BD460D6504F64CC1BBC417D6B5DE5DE8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'moneyflow-api-nine'
          slot-name: 'Production'
          package: .
          